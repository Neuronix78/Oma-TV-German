name: APK bauen

on:
  push:
    branches: [main]
    paths-ignore:
      - 'sender.m3u'
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Signaturschlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein Signaturschlüssel hinterlegt. Die APK wird mit einem Testschlüssel signiert, spätere Updates lassen sich dann NICHT drüberinstallieren."
          fi

      - name: APK bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APKs umbenennen
        run: cp app/build/outputs/apk/release/*.apk "fernsehen-${{ github.run_number }}.apk"
             cp app/build/outputs/apk/lite/release/*.apk "fernsehen-lite-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: fernsehen-apk-${{ github.run_number }}
          path: fernsehen-*.apk
